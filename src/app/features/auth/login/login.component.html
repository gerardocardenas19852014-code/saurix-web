<div class="auth-box">
  <span class="eyebrow">§ Saurix</span>
  <h1>Iniciar sesión</h1>

  <div class="fuente-datos" role="radiogroup" aria-label="Dónde se guardan los datos">
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="fuenteDatos === 'supabase'"
      [class.activa]="fuenteDatos === 'supabase'"
      (click)="cambiarFuente('supabase')"
    >
      ☁️ Nube
    </button>
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="fuenteDatos === 'indexeddb'"
      [class.activa]="fuenteDatos === 'indexeddb'"
      (click)="cambiarFuente('indexeddb')"
    >
      💻 Este navegador
    </button>
  </div>
  <p class="fuente-datos-ayuda">
    {{ fuenteDatos === 'supabase'
      ? 'Tus datos se guardan en Supabase y los ves desde cualquier dispositivo.'
      : 'Tus datos se guardan solo en este navegador (sin internet).' }}
  </p>

  <form [formGroup]="form" (ngSubmit)="entrar()">
    <label>
      Usuario
      <input type="text" formControlName="usuario" placeholder="p.ej. ana" autofocus autocomplete="username" />
    </label>
    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <label class="checkbox-inline">
      <input type="checkbox" formControlName="recordarUsuario" />
      Recordar usuario
    </label>
    @if (mensajeError()) {
      <p class="login-error" role="alert">{{ mensajeError() }}</p>
    }
    <button type="submit" class="btn-primary" [disabled]="enviando()">Entrar</button>
  </form>
</div>
