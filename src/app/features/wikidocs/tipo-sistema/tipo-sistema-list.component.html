<div class="page-header">
  <div>
    <span class="eyebrow">§ WikiDocs</span>
    <h1>Tipo de sistema</h1>
  </div>
</div>

<div class="grid-toolbar">
  <button type="button" class="toolbar-btn" title="Nuevo tipo de sistema (Alt+N)" (click)="nuevo()">+ Nuevo</button>
  <button type="button" class="btn-primary small" title="Buscar (Alt+B)" (click)="buscar()">🔍 Buscar</button>
  <button type="button" class="btn-secondary small" title="Limpiar filtros (Alt+L)" (click)="limpiarFiltros()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px; margin-right:4px;">
      <path d="M12.531 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14v6a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341l.427-.473" />
      <path d="m16.5 3.5 5 5" />
      <path d="m21.5 3.5-5 5" />
    </svg>
    Limpiar filtros
  </button>

  <div class="toolbar-group">
    <button
      type="button"
      class="btn-secondary small toolbar-icon-button"
      title="Exportar CSV"
      aria-label="Exportar tipos de sistema a CSV"
      (click)="exportarCsvArchivo()"
    >
      ⇩
    </button>
    <app-bitacora modulo="WikiDocs / Tipo de sistema" />
  </div>

  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por nombre…"
      [value]="busquedaEnEdicion()"
      (input)="busquedaEnEdicion.set($any($event.target).value)"
      (keyup.enter)="buscar()"
    />
    <label class="board-filter-field board-filter-checkbox" style="margin:0;">
      <input
        type="checkbox"
        [checked]="mostrarInactivosEnEdicion()"
        (change)="mostrarInactivosEnEdicion.set($any($event.target).checked)"
      />
      Mostrar inactivos
    </label>
  </div>
</div>

<!-- Fase B: no se consulta nada al abrir la pantalla (ver ngOnInit() en el
     .ts) -- solo se muestra esta invitación hasta que el usuario presione
     "Buscar" o Enter por primera vez. -->
@if (!haBuscado()) {
  <p class="empty" style="margin-top:20px;">Presiona "🔍 Buscar" para consultar los registros.</p>
} @else {
  <app-data-table
    [columnas]="columnas"
    [filas]="registrosPagina()"
    [cargando]="cargando()"
    [tamanoPagina]="preferenciasGrid.tamanoPagina()"
    [modoServidor]="true"
    [paginaExterna]="paginaActual()"
    [totalExterno]="totalFiltrado()"
    [campoOrdenExterno]="columnaOrden()"
    [direccionOrdenExterno]="direccionOrden()"
    (paginaCambio)="onPaginaCambio($event)"
    (ordenCambio)="onOrdenCambio($event)"
    (editar)="editar($event)"
    (eliminar)="pedirEliminar($event)"
  />
}

@if (modalAbierto()) {
  <div class="modal-overlay modal show d-block" (click)="onClicFondoModal($event)">
    <form
      class="modal-box modal-dialog modal-content"
      [formGroup]="form"
      (click)="$event.stopPropagation()"
      (ngSubmit)="guardar()"
      (keydown)="onTabDentroDelModal($event)"
    >
      <h3 class="modal-title mb-3">{{ registroEnEdicion() ? 'Editar tipo de sistema' : 'Nuevo tipo de sistema' }}</h3>

      <div class="edit-form">
        <label class="floating-field full-span">
          <span>Nombre <b>*</b></span>
          <input
            type="text"
            class="form-control pill-control"
            formControlName="nombre"
            placeholder=" "
            aria-label="Nombre"
            #primerCampo
          />
        </label>
        <label class="checkbox-inline full-span"><input type="checkbox" formControlName="activo" />Activo</label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary btn btn-outline-secondary" title="Cancelar (Esc)" [disabled]="guardando()" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-primary btn btn-primary" title="Guardar (Ctrl+Enter)" [disabled]="form.invalid || guardando()">
          {{ guardando() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="registroAEliminar() !== null"
  titulo="Eliminar tipo de sistema"
  [mensaje]="'¿Eliminar el tipo de sistema ' + (registroAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="registroAEliminar.set(null)"
/>

<app-confirm-dialog
  [visible]="avisoCierreVisible()"
  titulo="Cambios sin guardar"
  mensaje="Este formulario tiene cambios sin guardar. ¿Seguro que quieres cerrarlo sin guardarlos?"
  textoConfirmar="Cerrar sin guardar"
  (confirmar)="confirmarCierreSinGuardar()"
  (cancelar)="cancelarCierreSinGuardar()"
/>
