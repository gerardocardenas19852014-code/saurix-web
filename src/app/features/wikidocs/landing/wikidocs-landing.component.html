<div class="page-header">
  <h1>WikiDocs</h1>
</div>

@for (grupo of grupos; track grupo.titulo) {
  <div class="catalog-group">
    <h2 class="catalog-group-title">
      {{ grupo.titulo }}
      <span class="catalog-group-count">{{ grupo.enlaces.length }}</span>
    </h2>

    <div class="catalog-list">
      @for (enlace of grupo.enlaces; track enlace.ruta) {
        <a class="catalog-list-item" [routerLink]="enlace.ruta">
          <span class="catalog-list-icon catalog-list-icon-{{ enlace.color }}">{{ enlace.icono }}</span>
          <div class="catalog-list-body">
            <h3>{{ enlace.titulo }}</h3>
            <p>{{ enlace.descripcion }}</p>
          </div>
          <span class="workspace-card-enter catalog-list-enter">Entrar →</span>
        </a>
      }
    </div>
  </div>
}
