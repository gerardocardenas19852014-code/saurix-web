<div class="page-header">
  <div>
    <span class="eyebrow">§ WikiDocs</span>
    <h1>Plantillas</h1>
  </div>
</div>

<div class="grid-toolbar">
  <button type="button" class="toolbar-btn" (click)="nuevo()">+ Nueva plantilla</button>

  <div class="toolbar-group">
    <button
      type="button"
      class="btn-secondary small toolbar-icon-button"
      title="Exportar CSV"
      aria-label="Exportar plantillas a CSV"
      (click)="exportarCsvArchivo()"
    >
      ⇩
    </button>
    <app-bitacora modulo="WikiDocs / Plantillas" />
  </div>

  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por nombre…"
      [value]="busqueda()"
      (input)="busqueda.set($any($event.target).value)"
    />
  </div>
</div>

<app-data-table
  [columnas]="columnas"
  [filas]="registros()"
  [cargando]="cargando()"
  [tamanoPagina]="preferenciasGrid.tamanoPagina()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
/>

@if (modalAbierto()) {
  <div class="modal-overlay modal show d-block" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">
    <form class="modal-box modal-dialog modal-content plantilla-modal" [formGroup]="form" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3 class="modal-title mb-3">{{ registroEnEdicion() ? 'Editar plantilla' : 'Nueva plantilla' }}</h3>

      <div class="edit-form">
        <label class="floating-field full-span">
          <span>Nombre <b>*</b></span>
          <input type="text" class="form-control pill-control" formControlName="nombre" placeholder=" " aria-label="Nombre" />
        </label>

        <label class="full-span">
          Contenido de partida
          <app-editor-texto formControlName="contenido" />
        </label>

        <label class="checkbox-inline full-span">
          <input type="checkbox" formControlName="activo" />
          Activo
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary btn btn-outline-secondary" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">Cancelar</button>
        <button type="submit" class="btn-primary btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="registroAEliminar() !== null"
  titulo="Eliminar plantilla"
  [mensaje]="'¿Eliminar la plantilla ' + (registroAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="registroAEliminar.set(null)"
/>
