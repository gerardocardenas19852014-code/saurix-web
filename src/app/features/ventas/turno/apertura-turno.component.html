<div class="page-header">
  <h1>Apertura de caja</h1>
</div>

<p class="hint" style="margin-top:-6px;">
  Captura el efectivo con el que arranca el turno — se usará como base para calcular lo que debería
  haber en caja al hacer el corte o el cierre.
</p>

<form class="edit-form" style="max-width: 420px;" [formGroup]="form" (ngSubmit)="abrir()">
  <label>
    Monto de apertura (efectivo inicial)
    <input type="number" step="0.01" min="0" formControlName="montoApertura" />
  </label>

  <label>
    Notas (opcional)
    <textarea rows="3" formControlName="notas"></textarea>
  </label>

  <div class="modal-actions" style="justify-content: flex-start;">
    <button type="submit" class="btn-primary" [disabled]="guardando()">Abrir turno</button>
  </div>
</form>
