<div class="page-header">
  <h1>Clientes</h1>
  <div class="page-actions">
    <button type="button" class="toolbar-btn" (click)="nuevo()">+ Nuevo</button>
  </div>
</div>

<div class="grid-toolbar">
  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por nombre…"
      [value]="busqueda()"
      (input)="busqueda.set($any($event.target).value); cargar()"
    />
  </div>
</div>

<app-data-table
  [columnas]="columnas"
  [filas]="clientes()"
  [cargando]="cargando()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
/>

@if (modalAbierto()) {
  <div class="modal-overlay show" (click)="modalAbierto.set(false)">
    <form class="modal-box" [formGroup]="form" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ clienteEnEdicion() ? 'Editar cliente' : 'Nuevo cliente' }}</h3>

      <div class="edit-form" style="margin-bottom: 18px;">
        <label>
          Nombre
          <input type="text" formControlName="nombre" />
        </label>

        <label>
          Teléfono
          <input type="text" formControlName="telefono" />
        </label>

        <label>
          Email
          <input type="email" formControlName="email" />
        </label>

        <label>
          Dirección
          <textarea rows="2" formControlName="direccion"></textarea>
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="modalAbierto.set(false)">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="clienteAEliminar() !== null"
  titulo="Eliminar cliente"
  [mensaje]="'¿Eliminar ' + (clienteAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="clienteAEliminar.set(null)"
/>
