<div class="page-header">
  <h1>Módulos</h1>
  <div class="page-actions">
    <button type="button" class="toolbar-btn" (click)="nuevo()">+ Nuevo</button>
  </div>
</div>

<div class="grid-toolbar">
  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por nombre…"
      [value]="busqueda()"
      (input)="busqueda.set($any($event.target).value); cargar()"
    />
    <label class="board-filter-field board-filter-checkbox" style="margin:0;">
      <input type="checkbox" [checked]="mostrarInactivos()" (change)="mostrarInactivos.set($any($event.target).checked)" />
      Mostrar inactivos
    </label>
  </div>
</div>

<app-data-table
  [columnas]="columnas"
  [filas]="modulosFiltrados()"
  [cargando]="cargando()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
/>

@if (modalAbierto()) {
  <div class="modal-overlay show" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">
    <form class="modal-box" [formGroup]="form" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ moduloEnEdicion() ? 'Editar módulo' : 'Nuevo módulo' }}</h3>

      <div class="edit-form" style="margin-bottom: 18px;">
        <label>
          Nombre
          <input type="text" formControlName="nombre" />
        </label>

        <label>
          Clave
          <input type="text" formControlName="clave" />
        </label>

        <label>
          Icono
          <div class="icono-picker-row">
            <span class="icono-picker-preview">{{ form.controls.icono.value || '·' }}</span>
            <input type="text" formControlName="icono" placeholder="Elige uno o escribe tu propio emoji" />
          </div>
        </label>

        <div class="icono-picker-opciones" role="group" aria-label="Íconos sugeridos">
          @for (opcion of iconosSugeridos; track opcion) {
            <button
              type="button"
              class="icono-picker-opcion"
              [class.is-active]="form.controls.icono.value === opcion"
              [attr.aria-pressed]="form.controls.icono.value === opcion"
              [title]="opcion"
              (click)="elegirIcono(opcion)"
            >
              {{ opcion }}
            </button>
          }
        </div>

        <label class="checkbox-inline">
          <input type="checkbox" formControlName="activo" />
          Activo
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="moduloAEliminar() !== null"
  titulo="Eliminar módulo"
  [mensaje]="'¿Eliminar ' + (moduloAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="moduloAEliminar.set(null)"
/>
