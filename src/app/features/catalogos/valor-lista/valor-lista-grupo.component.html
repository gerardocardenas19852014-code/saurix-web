<div class="page-header">
  <div>
    <span class="eyebrow">§ Catálogos</span>
    <h1>{{ tituloGrupo }}</h1>
  </div>
</div>

<div class="grid-toolbar">
  <button type="button" class="toolbar-btn" (click)="nuevo()">+ Nuevo valor</button>
  <app-bitacora [modulo]="moduloBitacora" />
</div>

<app-data-table
  [columnas]="columnas"
  [filas]="registros()"
  [cargando]="cargando()"
  [tamanoPagina]="preferenciasGrid.tamanoPagina()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
/>

@if (modalAbierto()) {
  <div class="modal-overlay modal show d-block" (click)="cerrarModal()">
    <form class="modal-box modal-dialog modal-content" [formGroup]="form" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3 class="modal-title mb-3">{{ registroEnEdicion() ? 'Editar valor' : 'Nuevo valor' }}</h3>
      @if (claveBloqueada()) {
        <p class="hint" style="margin:-8px 0 14px;">
          🔒 Este valor lo usan otras pantallas del sistema — solo puedes cambiar cómo se muestra (Etiqueta), no la clave interna.
        </p>
      }

      <div class="edit-form">
        <label class="floating-field">
          <span>Etiqueta (lo que ve el usuario) <b>*</b></span>
          <input type="text" class="form-control pill-control" formControlName="etiqueta" placeholder=" " aria-label="Etiqueta" />
        </label>

        <label class="floating-field">
          <span>Clave (lo que se guarda) <b>*</b></span>
          <input type="text" class="form-control pill-control" formControlName="clave" placeholder=" " aria-label="Clave" />
        </label>

        <label class="floating-field">
          <span>Orden <b>*</b></span>
          <input type="number" min="1" class="form-control pill-control" formControlName="orden" placeholder=" " aria-label="Orden" />
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary btn btn-outline-secondary" (click)="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn-primary btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="registroAEliminar() !== null"
  titulo="Eliminar valor"
  [mensaje]="'¿Eliminar el valor ' + (registroAEliminar()?.etiqueta ?? '') + '? Los registros que ya lo tengan guardado conservan el texto anterior.'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="registroAEliminar.set(null)"
/>
