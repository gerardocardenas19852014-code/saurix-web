<div class="page-header">
  <h1>Categorías de Presupuesto</h1>
  <div class="page-actions">
    <button type="button" class="toolbar-btn" (click)="nueva()">+ Nueva</button>
  </div>
</div>

<div class="grid-toolbar">
  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por nombre…"
      [value]="busqueda()"
      (input)="busqueda.set($any($event.target).value); cargar()"
    />
  </div>
</div>

<app-data-table
  [columnas]="columnas"
  [filas]="categorias()"
  [cargando]="cargando()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
/>

@if (modalAbierto()) {
  <div class="modal-overlay show" (click)="modalAbierto.set(false)">
    <form class="modal-box" [formGroup]="form" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ categoriaEnEdicion() ? 'Editar categoría' : 'Nueva categoría' }}</h3>

      <div class="edit-form" style="margin-bottom: 18px;">
        <label>
          Nombre
          <input type="text" formControlName="nombre" />
        </label>

        <label>
          Categoría padre (opcional, solo 2 niveles)
          <select formControlName="categoriaPresupuestoPadreId">
            <option [value]="0">Ninguna (categoría raíz)</option>
            @for (raiz of categoriasRaiz(); track raiz.id) {
              @if (!categoriaEnEdicion() || raiz.id !== categoriaEnEdicion()!.id) {
                <option [value]="raiz.id">{{ raiz.nombre }}</option>
              }
            }
          </select>
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="modalAbierto.set(false)">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="categoriaAEliminar() !== null"
  titulo="Eliminar categoría"
  [mensaje]="'¿Eliminar ' + (categoriaAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="categoriaAEliminar.set(null)"
/>
