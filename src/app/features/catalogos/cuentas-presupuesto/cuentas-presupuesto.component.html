<div class="page-header">
  <h1>Cuentas de Presupuesto</h1>
  <div class="page-actions">
    <button type="button" class="toolbar-btn" (click)="nueva()">+ Nueva</button>
  </div>
</div>

<div class="grid-toolbar">
  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por nombre…"
      [value]="busqueda()"
      (input)="busqueda.set($any($event.target).value); cargar()"
    />
  </div>
</div>

<app-data-table
  [columnas]="columnas"
  [filas]="cuentas()"
  [cargando]="cargando()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
/>

@if (modalAbierto()) {
  <div class="modal-overlay show" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">
    <form class="modal-box" [formGroup]="form" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ cuentaEnEdicion() ? 'Editar cuenta' : 'Nueva cuenta' }}</h3>

      <div class="edit-form" style="margin-bottom: 18px;">
        <label>
          Nombre
          <input type="text" formControlName="nombre" />
        </label>

        <label>
          Tipo
          <select formControlName="tipo">
            <option value="Efectivo">Efectivo</option>
            <option value="Banco">Banco</option>
            <option value="Tarjeta">Tarjeta</option>
            <option value="Ahorro">Ahorro</option>
          </select>
        </label>

        @if (esTarjeta) {
          <label>
            Límite de crédito
            <input type="number" formControlName="limiteCredito" />
          </label>
          <label>
            Día de corte
            <input type="number" min="1" max="31" formControlName="diaCorte" />
          </label>
          <label>
            Día de pago
            <input type="number" min="1" max="31" formControlName="diaPago" />
          </label>
          <label>
            Pago mínimo
            <input type="number" formControlName="pagoMinimo" />
          </label>
          <label>
            Pago sin intereses
            <input type="number" formControlName="pagoSinIntereses" />
          </label>
        }
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="cuentaAEliminar() !== null"
  titulo="Eliminar cuenta"
  [mensaje]="'¿Eliminar ' + (cuentaAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="cuentaAEliminar.set(null)"
/>
