<div class="page-header">
  <h1>Unidades de medida</h1>
</div>

<div class="grid-toolbar">
  <button type="button" class="toolbar-btn" (click)="nuevo()">+ Nueva</button>

  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por nombre…"
      [value]="busqueda()"
      (input)="busqueda.set($any($event.target).value); cargar()"
    />
    <label class="board-filter-field board-filter-checkbox" style="margin:0;">
      <input type="checkbox" [checked]="mostrarInactivos()" (change)="mostrarInactivos.set($any($event.target).checked)" />
      Mostrar inactivas
    </label>
  </div>
</div>

<app-data-table
  [tamanoPagina]="preferenciasGrid.tamanoPagina()"
  [columnas]="columnas"
  [filas]="unidadesFiltradas()"
  [cargando]="cargando()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
/>

@if (modalAbierto()) {
  <div class="modal-overlay show" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">
    <form class="modal-box" [formGroup]="form" (click)="$event.stopPropagation()" (ngSubmit)="guardar()">
      <h3>{{ unidadEnEdicion() ? 'Editar unidad' : 'Nueva unidad' }}</h3>

      <div class="edit-form" style="margin-bottom: 18px;">
        <label>
          Nombre
          <input type="text" formControlName="nombre" placeholder="Ej. Pieza, Kilogramo, Caja…" />
        </label>

        <label>
          Clave
          <input type="text" formControlName="clave" placeholder="Ej. PZA, KG, CAJA…" />
        </label>

        <label class="checkbox-inline">
          <input type="checkbox" formControlName="activo" />
          Activo
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" (click)="modalAbierto.set(false); toast.info('Cambios descartados.')">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="unidadAEliminar() !== null"
  titulo="Eliminar unidad"
  [mensaje]="'¿Eliminar ' + (unidadAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="unidadAEliminar.set(null)"
/>
