<div class="page-header">
  <h1>Módulos</h1>
</div>

<div class="grid-toolbar">
  <button type="button" class="toolbar-btn" title="Nuevo módulo (Alt+N)" (click)="nuevo()">+ Nuevo</button>
  <button type="button" class="btn-primary small" title="Buscar (Alt+B)" (click)="buscar()">🔍 Buscar</button>
  <button type="button" class="btn-secondary small" title="Limpiar filtros (Alt+L)" (click)="limpiarFiltros()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px; margin-right:4px;">
      <path d="M12.531 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14v6a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341l.427-.473" />
      <path d="m16.5 3.5 5 5" />
      <path d="m21.5 3.5-5 5" />
    </svg>
    Limpiar filtros
  </button>

  <div class="grid-filter">
    <input
      type="search"
      placeholder="Buscar por clave o nombre…"
      [value]="busquedaEnEdicion()"
      (input)="busquedaEnEdicion.set($any($event.target).value)"
      (keyup.enter)="buscar()"
    />
    <label class="board-filter-field board-filter-checkbox" style="margin:0;">
      <input
        type="checkbox"
        [checked]="mostrarInactivosEnEdicion()"
        (change)="mostrarInactivosEnEdicion.set($any($event.target).checked)"
      />
      Mostrar inactivos
    </label>
  </div>
</div>

<!-- Mandato 87: no se consulta nada al abrir la pantalla (ver ngOnInit() en el .ts). -->
@if (!haBuscado()) {
  <p class="empty" style="margin-top:20px;">Presiona "🔍 Buscar" para consultar los registros.</p>
} @else {
<app-data-table
  [tamanoPagina]="preferenciasGrid.tamanoPagina()"
  [columnas]="columnas"
  [filas]="modulosPagina()"
  [cargando]="cargando()"
  [modoServidor]="true"
  [paginaExterna]="paginaActual()"
  [totalExterno]="totalFiltrado()"
  (editar)="editar($event)"
  (eliminar)="pedirEliminar($event)"
  (paginaCambio)="onPaginaCambio($event)"
/>
}

@if (modalAbierto()) {
  <div class="modal-overlay show" (click)="onClicFondoModal($event)">
    <form
      class="modal-box"
      [formGroup]="form"
      (click)="$event.stopPropagation()"
      (ngSubmit)="guardar()"
      (keydown)="onTabDentroDelModal($event)"
    >
      <h3>{{ moduloEnEdicion() ? 'Editar módulo' : 'Nuevo módulo' }}</h3>

      <div class="edit-form" style="margin-bottom: 18px;">
        <label>
          Nombre
          <input type="text" formControlName="nombre" #primerCampo />
          @if (form.controls.nombre.invalid && form.controls.nombre.touched) {
            <small class="form-error" style="display:block;margin-top:4px;padding:4px 8px;font-size:12px;">El nombre es obligatorio.</small>
          }
        </label>

        <label>
          Clave
          <input type="text" formControlName="clave" />
          @if (form.controls.clave.invalid && form.controls.clave.touched) {
            <small class="form-error" style="display:block;margin-top:4px;padding:4px 8px;font-size:12px;">La clave es obligatoria.</small>
          }
        </label>

        <label>
          Icono
          <div class="icono-picker-row">
            <span class="icono-picker-preview">{{ form.controls.icono.value || '·' }}</span>
            <input type="text" formControlName="icono" placeholder="Elige uno o escribe tu propio emoji" />
          </div>
        </label>

        <div class="icono-picker-opciones" role="group" aria-label="Íconos sugeridos">
          @for (opcion of iconosSugeridos; track opcion) {
            <button
              type="button"
              class="icono-picker-opcion"
              [class.is-active]="form.controls.icono.value === opcion"
              [attr.aria-pressed]="form.controls.icono.value === opcion"
              [title]="opcion"
              (click)="elegirIcono(opcion)"
            >
              {{ opcion }}
            </button>
          }
        </div>

        <label class="checkbox-inline">
          <input type="checkbox" formControlName="activo" />
          Activo
        </label>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" title="Cancelar (Esc)" [disabled]="guardando()" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn-primary" title="Guardar (Ctrl+Enter)" [disabled]="form.invalid || guardando()">
          {{ guardando() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </form>
  </div>
}

<app-confirm-dialog
  [visible]="moduloAEliminar() !== null"
  titulo="Eliminar módulo"
  [mensaje]="'¿Eliminar ' + (moduloAEliminar()?.nombre ?? '') + '?'"
  (confirmar)="confirmarEliminar()"
  (cancelar)="moduloAEliminar.set(null)"
/>

<app-confirm-dialog
  [visible]="avisoCierreVisible()"
  titulo="Cambios sin guardar"
  mensaje="Este formulario tiene cambios sin guardar. ¿Seguro que quieres cerrarlo sin guardarlos?"
  textoConfirmar="Cerrar sin guardar"
  (confirmar)="confirmarCierreSinGuardar()"
  (cancelar)="cancelarCierreSinGuardar()"
/>
